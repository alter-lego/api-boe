# Vigila que la ingesta diaria del BOE esté al día. Si la API no responde, la última ingesta correcta es
# de hace más de 6 horas (30 los domingos) o, de lunes a sábado, no es del BOE de hoy, la ejecución FALLA y GitHub avisa por correo a quien tenga activadas las
# notificaciones de Actions (Settings → Notifications → Actions → «Failed workflows only»).
# No necesita secretos: /v1/health es público.
name: Monitor de ingesta

on:
  schedule:
    # Lo lanza a su hora el Worker disparador-ingesta-boe (disparador/); este cron de GitHub es solo un respaldo,
    # porque GitHub lo retrasa horas. 10:00 UTC = 11:00 en invierno, tras las pasadas de 05:30 a 09:30 UTC.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL_HEALTH: https://api-boe.alter-lego.workers.dev/v1/health
      MAX_HORAS: '6'
    steps:
      - name: Consultar /v1/health y comprobar la antigüedad de la última ingesta
        run: |
          cuerpo=$(curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 20 "$URL_HEALTH") \
            || { echo "::error::/v1/health no responde: $cuerpo"; exit 1; }
          echo "$cuerpo"
          [ "$(echo "$cuerpo" | jq -r '.ok')" = "true" ] || { echo "::error::/v1/health devuelve ok distinto de true"; exit 1; }
          fin=$(echo "$cuerpo" | jq -r '.ultima_ingesta.fin // empty')
          [ -n "$fin" ] || { echo "::error::No hay ninguna ingesta correcta registrada"; exit 1; }
          fecha=$(echo "$cuerpo" | jq -r '.ultima_ingesta.fecha // empty')
          edad_h=$(( ( $(date -u +%s) - $(date -u -d "$fin" +%s) ) / 3600 ))
          echo "Última ingesta correcta: $fin (hace ${edad_h} h), del día $fecha"
          # El domingo no hay BOE ni pasadas de mañana: la última es la del sábado (auditoría, 2.20).
          dia=$(TZ=Europe/Madrid date +%u); hoy=$(TZ=Europe/Madrid date +%F)
          max=$MAX_HORAS; [ "$dia" = 7 ] && max=30
          if [ "$edad_h" -ge "$max" ]; then
            echo "::error::La última ingesta correcta es de hace ${edad_h} h (límite ${max} h). Revisa el workflow «Ingesta BOE»."
            exit 1
          fi
          # De lunes a sábado tiene que estar cargado el BOE de hoy.
          if [ "$dia" != 7 ] && [ "$fecha" != "$hoy" ]; then
            echo "::error::La última ingesta es del día $fecha, no de hoy ($hoy). Revisa el workflow «Ingesta BOE»."
            exit 1
          fi
